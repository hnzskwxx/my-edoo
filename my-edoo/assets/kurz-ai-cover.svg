<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754"
     role="img" aria-label="Obálka — AI ve firmě">
  <defs>
    <style>
      text { font-family: 'Inter','Inter var',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
      .meta { font-size: 23px;  font-weight: 600; letter-spacing: 5.5px; }
      .t1   { font-size: 258px; font-weight: 200; letter-spacing: -11px; }
      .t2   { font-size: 200px; font-weight: 600; letter-spacing: -9px; }
      .sub  { font-size: 42px;  font-weight: 300; letter-spacing: -0.4px; }
      .num  { font-size: 62px;  font-weight: 600; letter-spacing: -2px; }
      .lbl  { font-size: 21px;  font-weight: 500; letter-spacing: 3px; }
      .foot { font-size: 25px;  font-weight: 400; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect width="1240" height="1754" fill="#0E0E10"/>

  <text class="meta" x="100" y="112" fill="#8A8A90">MY-EDOO</text>
  <text class="meta" x="1140" y="112" fill="#8A8A90" text-anchor="end">KURZ</text>

  <g fill="#15A34A">
    <rect x="994" y="250" width="14" height="14"/>
    <rect x="1038" y="250" width="14" height="14"/>
    <rect x="1082" y="250" width="14" height="14"/>
    <rect x="1126" y="250" width="14" height="14"/>
    <rect x="994" y="294" width="14" height="14"/>
    <rect x="1038" y="294" width="14" height="14"/>
    <rect x="1082" y="294" width="14" height="14"/>
    <rect x="1126" y="294" width="14" height="14"/>
  </g>

  <text class="t1" x="94" y="656" fill="#FFFFFF">AI</text>

  <rect x="0" y="690" width="1240" height="280" fill="#15A34A"/>
  <text class="t2" x="94" y="885" fill="#FFFFFF">ve firmě</text>

  <text class="sub" x="100" y="1082" fill="#9A9AA0">Bezpečné používání AI a EU AI Act</text>

  <rect x="100" y="1360" width="1040" height="1" fill="#FFFFFF24"/>
  <text class="num" x="100" y="1452" fill="#FFFFFF">8</text>
  <text class="lbl" x="100" y="1496" fill="#8A8A90">LEKCÍ</text>
  <text class="num" x="447" y="1452" fill="#FFFFFF">1</text>
  <text class="lbl" x="447" y="1496" fill="#8A8A90">ZÁVĚREČNÝ TEST</text>
  <text class="num" x="794" y="1452" fill="#FFFFFF">3</text>
  <text class="lbl" x="794" y="1496" fill="#8A8A90">PRÁVNÍ OBLASTI</text>

  <rect x="100" y="1596" width="1040" height="1" fill="#FFFFFF24"/>
  <text class="foot" x="100" y="1662" fill="#8A8A90">GDPR · EU AI Act · Autorská práva</text>
  <text class="foot" x="1140" y="1662" fill="#15A34A" text-anchor="end">my-edoo</text>
</svg>
